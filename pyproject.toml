[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-socket-exfiltration-guard"
version = "0.1.0"
description = "Deep packet inspection and egress domain whitelist filter preventing unauthorized data exfiltration from agent tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-socket-exfiltration-guard = "agent_socket_exfiltration_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_socket_exfiltration_guard*"]
